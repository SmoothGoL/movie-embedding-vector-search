<!doctype html>
<html>
    <head>
        <title>Movie Embedding Vector Search</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Signika+Negative:wght@500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <main>
            <h1>
                ReelRecs
                <span class="icon material-symbols-outlined">chat_bubble</span>
            </h1>
            <button id="restart">Fresh restart</button>
            <form id="prompt-form">
                <input id="user-input" type="text" placeholder="How can I help?">
                <button class="send-btn">
                    <span class="icon material-symbols-outlined">send</span>
                </button>
            </form>
            <p id="query-prompt" class="results"></p>
            <div id="user-prompts" class="user-prompts"></div>
            <div id="reply" class="results"></div>
        </main>
        <script src="index.js" type="module"></script>
    </body>
</html>
